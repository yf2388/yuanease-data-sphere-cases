gold_version: case09-steel-energy-v1
status: frozen
protocol: entity-model-score-v1
weights: {entities: 0.3, identifiers: 0.2, relations: 0.3, metrics: 0.2}
weights_rationale: 沿用协议默认权重。
derivation: >-
  用电记录取自 UCI 原始数据（一行一个 15 分钟区间）；日历、负荷类型、班次三张表由 prepare/build_data.py 按确定规则拆出或自建，
  外键由生成规则决定（用电记录的日期、负荷类型代码、班次代码都取自对应表），已用 tools/casekit.py gold 核验。记录时间在样本内唯一，列为等价标识。
  指标依据数据集文档的变量说明：Usage_kWh（用电量）、CO2(tCO2)（二氧化碳排放）、Lagging_Current_Power_Factor（滞后功率因数，%）。
entities:
  - {table: 日历, kind: object, label: 日历, identifier: [[日期]]}
  - {table: 负荷类型, kind: object, label: 负荷类型, identifier: [[负荷类型代码], [负荷类型名称]]}
  - {table: 班次, kind: object, label: 班次, identifier: [[班次代码], [班次名称]]}
  - {table: 用电记录, kind: event, label: 用电记录, identifier: [[记录编号], [记录时间]]}
relations:
  - {from: 用电记录, to: 日历, on: [[日期, 日期]], relationship: many_to_one}
  - {from: 用电记录, to: 负荷类型, on: [[负荷类型代码, 负荷类型代码]], relationship: many_to_one}
  - {from: 用电记录, to: 班次, on: [[班次代码, 班次代码]], relationship: many_to_one}
metrics:
  - {table: 用电记录, label: 用电量, aggregate: sum, column: 用电量_kWh, filters: []}
  - {table: 用电记录, label: 二氧化碳排放, aggregate: sum, column: 二氧化碳_tCO2, filters: []}
  - {table: 用电记录, label: 平均滞后功率因数, aggregate: avg, column: 滞后功率因数, filters: []}
  - {table: 用电记录, label: 滞后无功电量, aggregate: sum, column: 滞后无功_kVarh, filters: [], required: false}
  - {table: 用电记录, label: 超前无功电量, aggregate: sum, column: 超前无功_kVarh, filters: [], required: false}
  - {table: 用电记录, label: 平均超前功率因数, aggregate: avg, column: 超前功率因数, filters: [], required: false}
  - {table: 用电记录, label: 最大 15 分钟用电量, aggregate: max, column: 用电量_kWh, filters: [], required: false}
  - {table: 用电记录, label: 平均 15 分钟用电量, aggregate: avg, column: 用电量_kWh, filters: [], required: false}
  - {table: 用电记录, label: 记录数, aggregate: count, column: null, filters: [], required: false}
  - {table: 用电记录, label: 重载用电量, aggregate: sum, column: 用电量_kWh, filters: [{column: 负荷类型代码, op: eq, value: Maximum_Load}], required: false}
  - {table: 用电记录, label: 功率因数偏低记录数, aggregate: count, column: null, filters: [{column: 滞后功率因数, op: lt, value: 90}], required: false}
format_gaps:
  - {area: metric, description: 日均用电量需要先按日期汇总再取平均（两级聚合）, tables: [用电记录]}
  - {area: metric, description: 按周末/工作日比较需要关联日历表，单表指标只能按日期筛选, tables: [用电记录, 日历]}
