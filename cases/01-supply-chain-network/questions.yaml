case: 01-supply-chain-network
note: 期望值由 sql 在 data/ 上独立算出（python3 -I tools/casekit.py answers <案例目录> --write）。判对规则：must_include 的每一项都出现在回答里（缺省为期望结果的全部取值；数字允许 0.5% 相对误差，列表项写成 [a, b] 表示任一即可）。
questions:
- id: q01
  question: 目前有多少家在产的工厂？
  sql: SELECT COUNT(*) FROM 工厂 WHERE 是否在产 = '是'
  expected:
    columns:
    - COUNT(*)
    rows:
    - - 24
  qtype: 单表聚合
  source: Snowflake 供应链助手仓库 SUPPLY_CHAIN_ASSISTANT_MODEL.yaml 的 verified_queries（MIT）「How many active MFG plants do we have?」
- id: q02
  question: 航空航天（AEROSPACE）业务线的产品一共有多少笔订单？
  sql: SELECT COUNT(*) FROM 订单 o JOIN 产品 p ON o.产品编号 = p.产品编号 WHERE p.业务线 = 'AEROSPACE'
  expected:
    columns:
    - COUNT(*)
    rows:
    - - 13
  qtype: 跨表关联
  source: Snowflake 供应链助手仓库 SUPPLY_CHAIN_ASSISTANT_MODEL.yaml 的 verified_queries（MIT）「How many orders are scheduled for the AEROSPACE business line?」
- id: q03
  question: 各工厂合计的成品（产品）在库数量是多少？
  sql: SELECT SUM(在库数量) FROM 工厂库存 WHERE 产品编号 IS NOT NULL
  expected:
    columns:
    - SUM(在库数量)
    rows:
    - - 4020
  qtype: 单表聚合
  source: Snowflake 供应链助手仓库 SUPPLY_CHAIN_ASSISTANT_MODEL.yaml 的 verified_queries（MIT）「What's the total quantity of finished goods we have in our manufacturing plants?」
- id: q04
  question: 按订单金额合计，排名前 5 的客户是哪几家？各自的订单金额是多少？
  sql: SELECT c.客户名称, SUM(o.订单金额) AS 金额 FROM 订单 o JOIN 客户 c ON o.客户编号 = c.客户编号 GROUP BY c.客户名称 ORDER BY 金额 DESC LIMIT 5
  expected:
    columns:
    - 客户名称
    - 金额
    rows:
    - - First Solar
      - 1220000.0
    - - ExxonMobil
      - 1115000.0
    - - BYD America
      - 850000.0
    - - NextEra Energy
      - 570000.0
    - - Tesla Energy
      - 450000.0
  qtype: 跨表关联
  source: Snowflake 供应链助手仓库 SUPPLY_CHAIN_ASSISTANT_MODEL.yaml 的 verified_queries（MIT）「Who are our top 5 customers by order value?」
- id: q05
  question: 2024 年 12 月一共收到多少笔订单？
  sql: SELECT COUNT(*) FROM 订单 WHERE 下单时间 >= '2024-12-01' AND 下单时间 < '2025-01-01'
  expected:
    columns:
    - COUNT(*)
    rows:
    - - 38
  qtype: 时间筛选
  source: Snowflake 供应链助手仓库 SUPPLY_CHAIN_ASSISTANT_MODEL.yaml 的 verified_queries（MIT）「How many orders did we receive in the last month?」（相对日期改为 2024 年 12 月）
- id: q06
  question: 按「在库数量低于安全库存，且可支撑天数不超过采购提前期加提前期波动」判定原材料库存偏低，一共有多少条偏低的库存记录？Phoenix Aerospace Manufacturing 工厂有哪几种原材料偏低？
  sql: SELECT COUNT(*), (SELECT GROUP_CONCAT(n, '、') FROM (SELECT m.原材料名称 AS n FROM 工厂库存 k JOIN 工厂 g ON k.工厂编号 = g.工厂编号 JOIN 原材料 m ON k.原材料编号 = m.原材料编号 WHERE g.工厂名称 = 'Phoenix Aerospace Manufacturing' AND k.在库数量 < k.安全库存 AND k.可支撑天数 <= k.采购提前期_天 + k.提前期波动_天 ORDER BY 1)) FROM 工厂库存 k WHERE k.原材料编号 IS NOT NULL AND k.在库数量 < k.安全库存 AND k.可支撑天数 <= k.采购提前期_天 + k.提前期波动_天
  must_include:
  - 26
  - Aluminum Alloy 6061-T6
  - Carbon Fiber Composite
  - Titanium Grade 5 Alloy
  expected:
    columns:
    - COUNT(*)
    - (SELECT GROUP_CONCAT(n, '、') FROM (SELECT m.原材料名称 AS n FROM 工厂库存 k JOIN 工厂 g ON k.工厂编号 = g.工厂编号 JOIN 原材料 m ON k.原材料编号 = m.原材料编号 WHERE g.工厂名称 = 'Phoenix Aerospace Manufacturing' AND k.在库数量 < k.安全库存 AND k.可支撑天数 <= k.采购提前期_天 + k.提前期波动_天 ORDER BY 1))
    rows:
    - - 26
      - Aluminum Alloy 6061-T6、Carbon Fiber Composite、Titanium Grade 5 Alloy
  qtype: 多表综合
  source: Snowflake 供应链助手仓库 SUPPLY_CHAIN_ASSISTANT_MODEL.yaml 的 verified_queries（MIT）「Which raw materials at our Manufacturing Plants are running low on inventory?」（改为计数并指定一家工厂的明细）
- id: q07
  question: 2024 年第四季度发出的货物中，有多少单实际到货晚于预计到货日期？
  sql: SELECT COUNT(*) FROM 发货 WHERE 实际到货日期 > 预计到货日期 AND 发货日期 >= '2024-10-01' AND 发货日期 < '2025-01-01'
  must_include:
  - - 0
    - 没有
    - 零
  expected:
    columns:
    - COUNT(*)
    rows:
    - - 0
  qtype: 时间筛选
  source: Snowflake 供应链助手仓库 SUPPLY_CHAIN_ASSISTANT_MODEL.yaml 的 verified_queries（MIT）「How many of our shipments were late last quarter?」（相对日期改为 2024 年第四季度）
- id: q08
  question: 名称里含有 steel 或 copper 的原材料有几种？分别叫什么？
  sql: SELECT COUNT(*), GROUP_CONCAT(原材料名称, '、') FROM (SELECT 原材料名称 FROM 原材料 WHERE LOWER(原材料名称) LIKE '%steel%' OR LOWER(原材料名称) LIKE '%copper%' ORDER BY 1)
  must_include:
  - 9
  - Carbon Steel A36
  - Copper C101
  - Copper Foil
  - Copper Wire 12 AWG
  - Silicon Steel
  - Stainless Steel 15-5 PH
  - Stainless Steel 304
  - Steel Reinforcement Bar
  - Tool Steel D2
  expected:
    columns:
    - COUNT(*)
    - GROUP_CONCAT(原材料名称, '、')
    rows:
    - - 9
      - Carbon Steel A36、Copper C101、Copper Foil、Copper Wire 12 AWG、Silicon Steel、Stainless Steel 15-5 PH、Stainless Steel 304、Steel Reinforcement Bar、Tool Steel D2
  qtype: 单表聚合
  source: Snowflake 供应链助手仓库 SUPPLY_CHAIN_ASSISTANT_MODEL.yaml 的 verified_queries（MIT）「material names … containing 'steel' or 'copper'」（改为种类与名称）
- id: q09
  question: 哪个供应商供应的原材料种类最多？供应几种？
  sql: SELECT s.供应商名称, COUNT(*) AS n FROM 原材料 m JOIN 供应商 s ON m.供应商编号 = s.供应商编号 GROUP BY s.供应商名称 ORDER BY n DESC LIMIT 1
  expected:
    columns:
    - 供应商名称
    - n
    rows:
    - - Smart Building Materials
      - 8
  qtype: 跨表关联
  source: 案例作者按本案例数据出题
- id: q10
  question: 订单金额合计最高的工厂是哪家？金额是多少？
  sql: SELECT g.工厂名称, SUM(o.订单金额) AS 金额 FROM 订单 o JOIN 工厂 g ON o.工厂编号 = g.工厂编号 GROUP BY g.工厂名称 ORDER BY 金额 DESC LIMIT 1
  expected:
    columns:
    - 工厂名称
    - 金额
    rows:
    - - Portland Wind Power
      - 1300000.0
  qtype: 跨表关联
  source: 案例作者按本案例数据出题
- id: q11
  question: 按「在库数量低于安全库存，且可支撑天数不超过采购提前期加提前期波动」判定低库存，全部工厂库存记录（原材料、零部件、成品都算）中有多少条处于低库存？涉及多少家工厂？
  sql: SELECT COUNT(*), COUNT(DISTINCT 工厂编号) FROM 工厂库存 k WHERE k.在库数量 < k.安全库存 AND k.可支撑天数 <= k.采购提前期_天 + k.提前期波动_天
  source: Snowflake 指南「Build a Supply Chain Assistant with Snowflake Intelligence」示例问题「Where do I have critical low inventory levels?」（低库存口径取自语义模型的 low_inventory 过滤器）
  expected:
    columns:
    - COUNT(*)
    - COUNT(DISTINCT 工厂编号)
    rows:
    - - 26
      - 17
  qtype: 单表聚合
- id: q12
  question: 稀土材料钕磁铁（Neodymium Magnet）在哪些工厂库存偏低（判定口径同上）？在库数量和安全库存各是多少？
  sql: SELECT g.工厂名称, k.在库数量, k.安全库存 FROM 工厂库存 k JOIN 工厂 g ON k.工厂编号 = g.工厂编号 JOIN 原材料 m ON k.原材料编号 = m.原材料编号 WHERE m.原材料名称 = 'Neodymium Magnet' AND k.在库数量 < k.安全库存 AND k.可支撑天数 <= k.采购提前期_天 + k.提前期波动_天
  source: Snowflake 指南「Build a Supply Chain Assistant with Snowflake Intelligence」示例问题「Where do we have low inventory of rare earth materials?」
  expected:
    columns:
    - 工厂名称
    - 在库数量
    - 安全库存
    rows:
    - - Miami Facility Management
      - 185
      - 275
  qtype: 多表综合
- id: q13
  question: 对每条偏低的原材料库存（判定口径同上），按补货目标量补足缺口：向供应商采购的成本 = 缺口 × 采购单价；如果另有工厂的同种原材料库存过剩（在库数量超过安全库存的 3 倍，且可支撑天数超过采购提前期的 2 倍），调拨成本 = 缺口 × 厂间运输基准成本 × 两厂之间的运输附加系数。有几条偏低库存可以从别的工厂调拨？这几条按调拨的成本合计、按采购的成本合计分别是多少？
  sql: WITH low AS (SELECT k.工厂编号 AS lp, k.原材料编号 AS mid, k.补货目标量 - k.在库数量 AS need, m.采购单价 AS cost, m.厂间运输基准成本 AS tc FROM 工厂库存 k JOIN 原材料 m ON k.原材料编号 = m.原材料编号 WHERE k.在库数量 < k.安全库存 AND k.可支撑天数 <= k.采购提前期_天 + k.提前期波动_天), exc AS (SELECT k.工厂编号 AS ep, k.原材料编号 AS mid, k.在库数量 - k.补货目标量 AS avail FROM 工厂库存 k WHERE k.在库数量 > 3 * k.安全库存 AND k.可支撑天数 > 2 * k.采购提前期_天) SELECT COUNT(*), ROUND(SUM(l.tc * MIN(l.need, e.avail) * t.运输附加系数), 2), ROUND(SUM(l.cost * l.need), 2) FROM low l JOIN exc e ON l.mid = e.mid JOIN 厂间运输附加费 t ON e.ep = t.调出工厂编号 AND l.lp = t.调入工厂编号
  source: Snowflake 指南「Build a Supply Chain Assistant with Snowflake Intelligence」示例问题「For plants with low inventory of a raw material, compare the cost of replenishing from a supplier vs transferring from another plant with excess inventory.」；口径取自 Snowflake 供应链助手仓库 SUPPLY_CHAIN_ASSISTANT_MODEL.yaml 的 verified_queries（MIT）「Material Transfer Cost Analysis」
  expected:
    columns:
    - COUNT(*)
    - ROUND(SUM(l.tc * MIN(l.need, e.avail) * t.运输附加系数), 2)
    - ROUND(SUM(l.cost * l.need), 2)
    rows:
    - - 12
      - 46548.37
      - 173555.5
  qtype: 多表综合
- id: q14
  question: 按「在库数量超过安全库存的 3 倍，且可支撑天数超过采购提前期的 2 倍」判定过剩，有多少条原材料库存过剩、可以支持调拨？涉及多少家工厂？
  sql: SELECT COUNT(*), COUNT(DISTINCT 工厂编号) FROM 工厂库存 k WHERE k.原材料编号 IS NOT NULL AND k.在库数量 > 3 * k.安全库存 AND k.可支撑天数 > 2 * k.采购提前期_天
  source: Snowflake 指南「Build a Supply Chain Assistant with Snowflake Intelligence」示例问题「Show me all plants with excess inventory that could support transfers.」（过剩口径取自语义模型的 excess_inventory 过滤器）
  expected:
    columns:
    - COUNT(*)
    - COUNT(DISTINCT 工厂编号)
    rows:
    - - 13
      - 11
  qtype: 单表聚合
- id: q15
  question: 按工厂统计库存里出现的成品种类数，哪两家工厂只有 1 种成品？
  sql: SELECT GROUP_CONCAT(n, '、') FROM (SELECT g.工厂名称 AS n FROM 工厂库存 k JOIN 工厂 g ON k.工厂编号 = g.工厂编号 WHERE k.产品编号 IS NOT NULL GROUP BY g.工厂名称 HAVING COUNT(DISTINCT k.产品编号) = 1 ORDER BY 1)
  source: Snowflake 供应链助手仓库 SUPPLY_CHAIN_ASSISTANT_MODEL.yaml 的 verified_queries（MIT）「What is the average production capacity utilization across our manufacturing plants?」（原查询实际统计各工厂库存中的成品种类数，按原查询口径改写）
  expected:
    columns:
    - GROUP_CONCAT(n, '、')
    rows:
    - - Cincinnati Engine Components、Wichita Aviation Systems
  qtype: 跨表关联
