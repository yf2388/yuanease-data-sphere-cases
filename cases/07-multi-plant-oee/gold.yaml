gold_version: case07-oee-v1
status: frozen
protocol: entity-model-score-v1
weights: {entities: 0.3, identifiers: 0.2, relations: 0.3, metrics: 0.2}
weights_rationale: 沿用协议默认权重。
derivation: >-
  本案例为自建合成数据，表结构、主键与外键由 prepare/build_data.py 的生成规则决定，金标按生成规则写出并用 tools/casekit.py gold 核验。
  指标是 OEE 的标准分解（可用率 × 性能率 × 质量率），生成时已把每个比率的分子分母写成数据列，所以全部可以写成「两个合计之比」。
entities:
  - {table: 工厂, kind: object, label: 工厂, identifier: [[工厂代码]]}
  - {table: 产线, kind: object, label: 产线, identifier: [[产线代码]]}
  - {table: 设备, kind: object, label: 设备, identifier: [[设备编号]]}
  - {table: 班次, kind: object, label: 班次, identifier: [[班次代码]]}
  - {table: 停机原因, kind: object, label: 停机原因, identifier: [[原因代码]]}
  - {table: 设备班次运行, kind: event, label: 设备班次运行, identifier: [[记录编号], [设备编号, 生产日期, 班次代码]]}
  - {table: 停机事件, kind: event, label: 停机事件, identifier: [[停机编号]]}
relations:
  - {from: 产线, to: 工厂, on: [[工厂代码, 工厂代码]], relationship: many_to_one}
  - {from: 设备, to: 产线, on: [[产线代码, 产线代码]], relationship: many_to_one}
  - {from: 设备班次运行, to: 设备, on: [[设备编号, 设备编号]], relationship: many_to_one}
  - {from: 设备班次运行, to: 班次, on: [[班次代码, 班次代码]], relationship: many_to_one}
  - {from: 停机事件, to: 设备, on: [[设备编号, 设备编号]], relationship: many_to_one}
  - {from: 停机事件, to: 班次, on: [[班次代码, 班次代码]], relationship: many_to_one}
  - {from: 停机事件, to: 停机原因, on: [[原因代码, 原因代码]], relationship: many_to_one}
metrics:
  - table: 设备班次运行
    label: 可用率
    aggregate: ratio
    numerator: {aggregate: sum, column: 运行时间_分钟, filters: []}
    denominator: {aggregate: sum, column: 计划时间_分钟, filters: []}
  - table: 设备班次运行
    label: 性能率
    aggregate: ratio
    numerator: {aggregate: sum, column: 理论加工时间_分钟, filters: []}
    denominator: {aggregate: sum, column: 运行时间_分钟, filters: []}
  - table: 设备班次运行
    label: 质量率
    aggregate: ratio
    numerator: {aggregate: sum, column: 合格品数, filters: []}
    denominator: {aggregate: sum, column: 实际产量, filters: []}
  - table: 设备班次运行
    label: OEE
    aggregate: ratio
    numerator: {aggregate: sum, column: 合格品理论时间_分钟, filters: []}
    denominator: {aggregate: sum, column: 计划时间_分钟, filters: []}
  - {table: 设备班次运行, label: 实际产量, aggregate: sum, column: 实际产量, filters: []}
  - {table: 设备班次运行, label: 合格品数, aggregate: sum, column: 合格品数, filters: []}
  - {table: 停机事件, label: 停机时长, aggregate: sum, column: 停机时长_分钟, filters: []}
  - {table: 设备班次运行, label: 计划时间, aggregate: sum, column: 计划时间_分钟, filters: [], required: false}
  - {table: 设备班次运行, label: 运行时间, aggregate: sum, column: 运行时间_分钟, filters: [], required: false}
  - {table: 设备班次运行, label: 停机时间, aggregate: sum, column: 停机时间_分钟, filters: [], required: false}
  - {table: 设备班次运行, label: 理论加工时间, aggregate: sum, column: 理论加工时间_分钟, filters: [], required: false}
  - {table: 设备班次运行, label: 合格品理论时间, aggregate: sum, column: 合格品理论时间_分钟, filters: [], required: false}
  - {table: 停机事件, label: 停机次数, aggregate: count, column: null, filters: [], required: false}
  - {table: 设备班次运行, label: 运行记录数, aggregate: count, column: null, filters: [], required: false}
format_gaps:
  - {area: metric, description: 不良品数（实际产量 − 合格品数）需要列与列运算，可由质量率间接表达, tables: [设备班次运行]}
  - {area: metric, description: 按停机类别（计划停机/故障停机等）统计停机时长需要先关联停机原因表，单表指标只能按原因代码筛选, tables: [停机事件, 停机原因]}
