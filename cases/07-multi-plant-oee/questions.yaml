- id: q10
  question: 9 月 15 日 EQ-312 三个班次合计的实际产量是多少？
  sql: SELECT SUM(实际产量) FROM 设备班次运行 WHERE 设备编号 = 'EQ-312' AND 生产日期 = '2026-09-15'
