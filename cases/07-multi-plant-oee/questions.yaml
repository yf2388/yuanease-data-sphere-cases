- id: q09
  question: 冲压一线（L21）在 9 月的停机次数是多少？
  sql: SELECT COUNT(*) FROM 停机事件 e JOIN 设备 d ON e.设备编号 = d.设备编号 WHERE d.产线代码 = 'L21'
