- id: q11
  question: 最近一个生产日（2026-09-30）全部设备的可用率是多少？
  sql: SELECT ROUND(1.0 * SUM(运行时间_分钟) / SUM(计划时间_分钟), 4) AS 可用率 FROM 设备班次运行 WHERE 生产日期 = (SELECT MAX(生产日期) FROM 设备班次运行)
  expected:
    columns:
    - 可用率
    rows:
    - - 0.9492
  qtype: 比率
  source: Databricks factory-optimization 解决方案加速器 notebook 01-Factory-optimization-OEE-score 开头的场景问题「What's my current availability」（「当前」改为数据的最后一天）
- id: q12
  question: 三家工厂里 9 月 OEE 最低的是哪家？这家工厂停机时长最多的停机原因是什么、停了多少分钟？
  sql: WITH f AS (SELECT g.工厂代码, g.工厂名称, ROUND(SUM(r.合格品理论时间_分钟) / SUM(r.计划时间_分钟), 4) AS OEE FROM 设备班次运行 r JOIN 设备 e ON e.设备编号 = r.设备编号 JOIN 产线 l ON l.产线代码 = e.产线代码 JOIN 工厂 g ON g.工厂代码 = l.工厂代码 GROUP BY g.工厂代码, g.工厂名称 ORDER BY OEE LIMIT 1) SELECT f.工厂名称, f.OEE, c.原因名称, SUM(s.停机时长_分钟) AS 停机分钟 FROM f JOIN 产线 l ON l.工厂代码 = f.工厂代码 JOIN 设备 e ON e.产线代码 = l.产线代码 JOIN 停机事件 s ON s.设备编号 = e.设备编号 JOIN 停机原因 c ON c.原因代码 = s.原因代码 GROUP BY f.工厂名称, f.OEE, c.原因名称 ORDER BY 停机分钟 DESC LIMIT 1
  expected:
    columns:
    - 工厂名称
    - OEE
    - 原因名称
    - 停机分钟
    rows:
    - - 佛山工厂
      - 0.8346
      - 待料
      - 2192
  must_include:
  - 佛山
  - 待料
  - 2192
  qtype: 多表综合
  source: Databricks factory-optimization 解决方案加速器 notebook 01-Factory-optimization-OEE-score 开头的场景问题「Do I have a factory under-performing and perform root cause analysis」（表现不佳量化为 OEE 最低，根因量化为停机时长最多的原因）
- id: q13
  question: 9 月全部设备的 OEE、可用率、性能率、质量率和总产量分别是多少？
  sql: SELECT ROUND(SUM(合格品理论时间_分钟) / SUM(计划时间_分钟), 4) AS OEE, ROUND(1.0 * SUM(运行时间_分钟) / SUM(计划时间_分钟), 4) AS 可用率, ROUND(SUM(理论加工时间_分钟) / SUM(运行时间_分钟), 4) AS 性能率, ROUND(1.0 * SUM(合格品数) / SUM(实际产量), 4) AS 质量率, SUM(实际产量) AS 总产量 FROM 设备班次运行
  expected:
    columns:
    - OEE
    - 可用率
    - 性能率
    - 质量率
    - 总产量
    rows:
    - - 0.8376
      - 0.951
      - 0.894
      - 0.9853
      - 2367585
  qtype: 比率
  source: Databricks factory-optimization 解决方案加速器 notebook 01-Factory-optimization-OEE-score 末尾看板 OEE_summary 的五张指标卡（OEE、Availability、Performance、Quality、Total Parts Made；OEE 按本案例的相乘口径）
- id: q14
  question: 9 月哪一天的不合格品（实际产量减合格品数）最多？当天全部设备的总产量是多少？
  sql: SELECT 生产日期, SUM(实际产量 - 合格品数) AS 不合格品数, SUM(实际产量) AS 总产量 FROM 设备班次运行 GROUP BY 生产日期 ORDER BY 不合格品数 DESC LIMIT 1
  expected:
    columns:
    - 生产日期
    - 不合格品数
    - 总产量
    rows:
    - - '2026-09-17'
      - 1277
      - 78332
  must_include:
  - - '2026-09-17'
    - 9月17日
    - 09-17
    - 9/17
  - 1277
  - 78332
  qtype: 排名
  source: Databricks factory-optimization 解决方案加速器 notebook 01-Factory-optimization-OEE-score 看板面板「Trend - Parts Made」（时间序列改为求不合格品最多的一天）
- id: q15
  question: 按「工厂 × 产线 × 班次」统计 9 月 OEE，最低的组合是哪个？OEE 是多少？
  sql: SELECT g.工厂名称, l.产线名称, b.班次名称, ROUND(SUM(r.合格品理论时间_分钟) / SUM(r.计划时间_分钟), 4) AS OEE FROM 设备班次运行 r JOIN 设备 e ON e.设备编号 = r.设备编号 JOIN 产线 l ON l.产线代码 = e.产线代码 JOIN 工厂 g ON g.工厂代码 = l.工厂代码 JOIN 班次 b ON b.班次代码 = r.班次代码 GROUP BY g.工厂名称, l.产线名称, b.班次名称 ORDER BY OEE LIMIT 1
  expected:
    columns:
    - 工厂名称
    - 产线名称
    - 班次名称
    - OEE
    rows:
    - - 重庆工厂
      - 注塑二线
      - 夜班
      - 0.8278
  qtype: 多表综合
  source: Databricks factory-optimization 解决方案加速器 notebook 01-Factory-optimization-OEE-score 看板面板「Plant Summary」与 Gold 层按工厂、产线、班次汇总（改为求最低组合）
