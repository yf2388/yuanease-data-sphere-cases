case: 05-purchasing-metrics
note: 期望值由 sql 在 data/ 上独立算出（python3 -I tools/casekit.py answers <案例目录> --write）。判对规则同 01 案例。
questions:
- id: q01
  question: 采购单按状态分别有多少张？
  sql: SELECT 状态, COUNT(*) FROM 采购单 GROUP BY 状态 ORDER BY 2 DESC
  expected:
    columns:
    - 状态
    - COUNT(*)
    rows:
    - - 已完成
      - 3689
    - - 待审批
      - 225
    - - 已驳回
      - 86
    - - 已批准
      - 12
  qtype: 分组统计
  source: 案例作者按本案例数据出题
- id: q02
  question: 全部采购明细的采购金额（行金额）合计是多少？
  sql: SELECT ROUND(SUM(行金额), 2) FROM 采购明细
  must_include:
  - - 63791994.84
    - 6379.2万
    - 6379.20万
    - 63791994.8
  expected:
    columns:
    - ROUND(SUM(行金额), 2)
    rows:
    - - 63791994.84
  qtype: 单表聚合
  source: 案例作者按本案例数据出题
- id: q03
  question: 收货检验的拒收率是多少？（拒收数量合计 ÷ 收货数量合计）
  sql: SELECT ROUND(SUM(拒收数量) / SUM(收货数量), 4) FROM 采购明细
  must_include:
  - - 0.0312
    - 3.12
  expected:
    columns:
    - ROUND(SUM(拒收数量) / SUM(收货数量), 4)
    rows:
    - - 0.0312
  qtype: 比率
  source: 案例作者按本案例数据出题
- id: q04
  question: 2025 年下单的采购单，应付总额合计是多少？
  sql: SELECT ROUND(SUM(应付总额), 2) FROM 采购单 WHERE 下单日期 >= '2025-01-01' AND 下单日期 < '2026-01-01'
  must_include:
  - - 43246846.4
    - 4324.68万
    - 4324.7万
  expected:
    columns:
    - ROUND(SUM(应付总额), 2)
    rows:
    - - 43246846.4
  qtype: 时间筛选
  source: 案例作者按本案例数据出题
- id: q05
  question: 应付总额合计最高的 3 家供应商是哪几家？
  sql: SELECT v.供应商名称 FROM 采购单 h JOIN 供应商 v ON h.供应商编号 = v.供应商编号 GROUP BY v.供应商名称 ORDER BY SUM(h.应付总额) DESC LIMIT 3
  expected:
    columns:
    - 供应商名称
    rows:
    - - Superior Bicycles
    - - Professional Athletic Consultants
    - - Chicago City Saddles
  qtype: 跨表关联
  source: 案例作者按本案例数据出题
- id: q06
  question: 采购单用得最多的运输方式是哪种？用了多少张单？
  sql: SELECT m.运输方式名称, COUNT(*) AS n FROM 采购单 h JOIN 运输方式 m ON h.运输方式编号 = m.运输方式编号 GROUP BY m.运输方式名称 ORDER BY n DESC LIMIT 1
  expected:
    columns:
    - 运输方式名称
    - n
    rows:
    - - CARGO TRANSPORT 5
      - 1523
  qtype: 跨表关联
  source: 案例作者按本案例数据出题
- id: q07
  question: 采购到的「零部件」大类产品，采购金额合计是多少？
  sql: SELECT ROUND(SUM(d.行金额), 2) FROM 采购明细 d JOIN 产品 p ON d.产品编号 = p.产品编号 JOIN 产品子类 s ON p.产品子类编号 = s.产品子类编号 JOIN 产品大类 c ON s.产品大类编号 = c.产品大类编号 WHERE c.大类名称 = '零部件'
  must_include:
  - - 26742023.17
    - 2674.2万
    - 2674.20万
    - 26742023.2
  expected:
    columns:
    - ROUND(SUM(d.行金额), 2)
    rows:
    - - 26742023.17
  qtype: 多表综合
  source: 案例作者按本案例数据出题
- id: q08
  question: 拒收数量最多的产品是哪个？拒收了多少件？
  sql: SELECT p.产品名称, SUM(d.拒收数量) AS n FROM 采购明细 d JOIN 产品 p ON d.产品编号 = p.产品编号 GROUP BY p.产品名称 ORDER BY n DESC LIMIT 1
  expected:
    columns:
    - 产品名称
    - n
    rows:
    - - Decal 1
      - 3248.0
  qtype: 跨表关联
  source: 案例作者按本案例数据出题
- id: q09
  question: 有多少家供应商一张采购单都没有？
  sql: SELECT COUNT(*) FROM 供应商 v WHERE NOT EXISTS (SELECT 1 FROM 采购单 h WHERE h.供应商编号 = v.供应商编号)
  expected:
    columns:
    - COUNT(*)
    rows:
    - - 18
  qtype: 多表综合
  source: 案例作者按本案例数据出题
- id: q10
  question: 状态为「已完成」、2025 年下单的采购单，运费合计是多少？
  sql: SELECT ROUND(SUM(运费), 2) FROM 采购单 WHERE 状态 = '已完成' AND 下单日期 >= '2025-01-01' AND 下单日期 < '2026-01-01'
  must_include:
  - - 828445.44
    - 82.84万
    - 82.8万
  expected:
    columns:
    - ROUND(SUM(运费), 2)
    rows:
    - - 828445.44
  qtype: 时间筛选
  source: 案例作者按本案例数据出题
- id: q11
  question: 2025 年 7 月下单的采购单，按状态分别的应付总额是多少？当月未结采购金额（待审批和已批准的应付总额）合计多少？
  sql: SELECT 状态, ROUND(SUM(应付总额), 2) AS 应付总额, ROUND(SUM(CASE WHEN 状态 IN ('待审批', '已批准') THEN 应付总额 ELSE 0 END), 2) AS 未结采购金额 FROM 采购单 WHERE substr(下单日期, 1, 7) = '2025-07' GROUP BY 状态 ORDER BY 状态
  expected:
    columns:
    - 状态
    - 应付总额
    - 未结采购金额
    rows:
    - - 已完成
      - 4023320.47
      - 0.0
    - - 已驳回
      - 100972.81
      - 0.0
    - - 待审批
      - 3296964.7
      - 3296964.7
  must_include:
  - 4023320.47
  - 100972.81
  - 3296964.7
  qtype: 时间筛选
  source: Databricks 指标视图 TPC-H 示例 Step 8「Query your metric view」 的按月与状态查询（total_revenue、open_order_revenue；TPC-H 订单改为采购单，固定为单数最多的 2025-07）
- id: q12
  question: 采购员 250、251、256、257、260 分别给供应商 Australia Bike Retailer（供应商编号 1492）下了多少张采购单？
  sql: SELECT 采购员工号, COUNT(*) AS 采购单数 FROM 采购单 WHERE 供应商编号 = 1492 AND 采购员工号 IN (250, 251, 256, 257, 260) GROUP BY 采购员工号 ORDER BY 采购员工号
  expected:
    columns:
    - 采购员工号
    - 采购单数
    rows:
    - - 250
      - 2
    - - 251
      - 5
    - - 256
      - 4
    - - 257
      - 4
    - - 260
      - 4
  qtype: 分组统计
  source: 微软 T-SQL 文档 FROM - Using PIVOT and UNPIVOT 的「Complex PIVOT example」（AdventureWorks 采购单按供应商与员工交叉计数，原文结果与本数据一致）
