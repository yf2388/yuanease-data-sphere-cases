  - - 6
  - - SAMEBIKE
  - - Alpine
  - - Goodyear
    - 固特异
  - - Renault
    - 雷诺
  - - Honda
    - 本田
  - - Dacia
    - 达契亚
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - (SELECT COUNT(*) FROM 召回通报 WHERE 风险等级 <> 'Serious risk')
    - 通报编号
    - 品牌
    rows:
    - - 6
      - OR/00002/25
      - SAMEBIKE
    - - 6
      - OR/00007/25
      - Alpine
    - - 6
      - OR/00060/25
      - Goodyear
    - - 6
      - OR/00145/25
      - Renault
    - - 6
      - OR/00149/25
      - Honda
    - - 6
      - OR/00152/25
      - Dacia
  qtype: 单表聚合
