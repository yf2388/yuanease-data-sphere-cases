gold_version: case06-malloy-recalls-v1
status: frozen
protocol: entity-model-score-v1
weights: {entities: 0.3, identifiers: 0.2, relations: 0.3, metrics: 0.2}
weights_rationale: 沿用协议默认权重。
derivation: >-
  召回表就是 Malloy 样例 auto_recalls.csv（裁剪到 2021 年起），NHTSA编号在 1,574 行里唯一；日历、部件、召回类型三张表由召回表的取值派生，
  关系就是派生它们的那一列。指标取自 Malloy 样例的语义模型 auto_recalls.malloy：recall_count（召回数）、total_defects
  （潜在受影响数量合计）与 percent_of_recalls（占比，是召回数对全体的比值，不是单表指标，列在 format_gaps）。已用 tools/casekit.py gold 核验。
entities:
  - {table: 召回, kind: event, label: 召回, identifier: [[NHTSA编号]]}
  - {table: 日历, kind: object, label: 日历, identifier: [[日期], [标准日期]]}
  - {table: 部件, kind: object, label: 部件, identifier: [[部件], [部件中文名]]}
  - {table: 召回类型, kind: object, label: 召回类型, identifier: [[召回类型], [召回类型中文名]]}
relations:
  - {from: 召回, to: 日历, on: [[报告接收日期, 日期]], relationship: many_to_one}
  - {from: 召回, to: 部件, on: [[部件, 部件]], relationship: many_to_one}
  - {from: 召回, to: 召回类型, on: [[召回类型, 召回类型]], relationship: many_to_one}
metrics:
  - {table: 召回, label: 召回数, aggregate: count, column: null, filters: []}
  - {table: 召回, label: 潜在受影响数量, aggregate: sum, column: 潜在受影响数量, filters: []}
  - {table: 召回, label: 厂商数, aggregate: count_distinct, column: 厂商, filters: [], required: false}
format_gaps:
  - {area: metric, description: Malloy 模型的 percent_of_recalls 是某组召回数占全体召回数的百分比（recall_count / all(recall_count)），要按分组计算，单表指标的分子分母都是全表合计时恒为 100%, tables: [召回]}
