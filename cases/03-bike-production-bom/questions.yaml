  expected:
    columns:
    - 大类名称
    - 产品数
    rows:
    - - 零部件
      - 134
    - - 整车
      - 97
    - - 服装
      - 35
    - - 配件
      - 29
  qtype: 多表综合
  source: SQL Server 2005 文档 AdventureWorks Product Scenario 示例 A（按大类、子类、型号列出产品）（原查询输出明细，改为计数）
