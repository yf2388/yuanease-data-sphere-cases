gold_version: case10-thelook-v1
status: frozen
protocol: entity-model-score-v1
weights: {entities: 0.3, identifiers: 0.2, relations: 0.3, metrics: 0.2}
weights_rationale: 沿用协议默认权重。
derivation: >-
  实体、唯一标识列与关系取自 Malloy 官方样例 ecommerce.malloy 的 primary_key 与 join_one：订单明细按用户编号连用户、按库存件编号连库存件，
  库存件按商品编号连商品。指标取自同一模型的度量：total_sales（售价合计）、order_count（订单编号去重计数）、order_item_count（明细计数）；
  退货率是五类指标里的比率指标（Malloy 的 frequent_returners 视图按状态 Returned 统计退货件数）。毛利（跨表的售价合计减成本合计）、
  累计、转化三类无法写成单表指标，列在 format_gaps。已用 tools/casekit.py gold 核验。
entities:
  - {table: 订单明细, kind: event, label: 订单明细, identifier: [[订单明细编号], [库存件编号]]}
  - {table: 库存件, kind: object, label: 库存件, identifier: [[库存件编号]]}
  - {table: 商品, kind: object, label: 商品, identifier: [[商品编号], [SKU]]}
  - {table: 用户, kind: object, label: 用户, identifier: [[用户编号]]}
relations:
  - {from: 订单明细, to: 用户, on: [[用户编号, 用户编号]], relationship: many_to_one}
  - {from: 订单明细, to: 库存件, on: [[库存件编号, 库存件编号]], relationship: many_to_one}
  - {from: 库存件, to: 商品, on: [[商品编号, 商品编号]], relationship: many_to_one}
metrics:
  - {table: 订单明细, label: 销售额, aggregate: sum, column: 售价, filters: []}
  - {table: 订单明细, label: 订单数, aggregate: count_distinct, column: 订单编号, filters: []}
  - {table: 订单明细, label: 订单明细数, aggregate: count, column: null, filters: []}
  - table: 订单明细
    label: 退货率
    aggregate: ratio
    numerator: {aggregate: count, column: null, filters: [{column: 状态, op: eq, value: Returned}]}
    denominator: {aggregate: count, column: null, filters: []}
  - {table: 库存件, label: 成本, aggregate: sum, column: 成本, filters: [], required: false}
  - {table: 用户, label: 用户数, aggregate: count, column: null, filters: [], required: false}
format_gaps:
  - {area: metric, description: 毛利（派生指标）= 订单明细的售价合计 − 关联库存件的成本合计，跨两张表，单表指标表达不了, tables: [订单明细, 库存件]}
  - {area: metric, description: 按月累计销售额（累计指标）需要按时间窗口滚动求和, tables: [订单明细]}
  - {area: metric, description: 首单后 90 天内复购的用户比例（转化指标）需要按用户排序比较两次下单时间, tables: [订单明细]}
