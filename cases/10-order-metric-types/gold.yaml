gold_version: case10-order-metric-types-v1
status: frozen
protocol: entity-model-score-v1
weights: {entities: 0.3, identifiers: 0.2, relations: 0.3, metrics: 0.2}
weights_rationale: 沿用协议默认权重。
derivation: >-
  本案例为自建合成数据，表结构、主键与外键由 prepare/build_data.py 的生成规则决定，金标按生成规则写出并用 tools/casekit.py gold 核验。
  报价单的成交订单号只在成交时有值（未成交为空），指向订单。指标覆盖 dbt 语义层教程讲的五类指标中本产品能表达的三类：
  简单（订单金额、订单数）、比率（按期交付率 = 按期交付订单数 / 已交付订单数）、转化（报价成交率 = 成交报价数 / 报价数）；
  累计与派生两类列在 format_gaps。
entities:
  - {table: 客户, kind: object, label: 客户, identifier: [[客户编码], [客户名称]]}
  - {table: 产品, kind: object, label: 产品, identifier: [[产品编码], [产品名称]]}
  - {table: 报价单, kind: event, label: 报价单, identifier: [[报价单号]]}
  - {table: 订单, kind: event, label: 订单, identifier: [[订单号]]}
  - {table: 订单明细, kind: event, label: 订单明细, identifier: [[订单号, 行号]]}
relations:
  - {from: 报价单, to: 客户, on: [[客户编码, 客户编码]], relationship: many_to_one}
  - {from: 报价单, to: 订单, on: [[成交订单号, 订单号]], relationship: one_to_one}
  - {from: 订单, to: 客户, on: [[客户编码, 客户编码]], relationship: many_to_one}
  - {from: 订单明细, to: 订单, on: [[订单号, 订单号]], relationship: many_to_one}
  - {from: 订单明细, to: 产品, on: [[产品编码, 产品编码]], relationship: many_to_one}
metrics:
  - {table: 订单, label: 订单金额, aggregate: sum, column: 订单金额, filters: []}
  - {table: 订单, label: 订单数, aggregate: count, column: null, filters: []}
  - table: 订单
    label: 按期交付率
    aggregate: ratio
    numerator: {aggregate: count, filters: [{column: 是否按期, op: eq, value: 是}]}
    denominator: {aggregate: count, filters: [{column: 订单状态, op: eq, value: 已交付}]}
  - table: 报价单
    label: 报价成交率
    aggregate: ratio
    numerator: {aggregate: count, filters: [{column: 是否成交, op: eq, value: 是}]}
    denominator: {aggregate: count, filters: []}
  - {table: 订单, label: 订单成本, aggregate: sum, column: 订单成本, filters: []}
  - {table: 报价单, label: 报价数, aggregate: count, column: null, filters: [], required: false}
  - {table: 报价单, label: 成交报价数, aggregate: count, column: null, filters: [{column: 是否成交, op: eq, value: 是}], required: false}
  - {table: 报价单, label: 报价金额, aggregate: sum, column: 报价金额, filters: [], required: false}
  - {table: 订单, label: 已交付订单数, aggregate: count, column: null, filters: [{column: 订单状态, op: eq, value: 已交付}], required: false}
  - {table: 订单, label: 按期交付订单数, aggregate: count, column: null, filters: [{column: 是否按期, op: eq, value: 是}], required: false}
  - {table: 订单, label: 已取消订单数, aggregate: count, column: null, filters: [{column: 订单状态, op: eq, value: 已取消}], required: false}
  - {table: 订单明细, label: 订货数量, aggregate: sum, column: 数量, filters: [], required: false}
  - {table: 订单明细, label: 明细金额, aggregate: sum, column: 金额, filters: [], required: false}
format_gaps:
  - {area: metric, description: 累计指标（按月累计订单金额）需要窗口累计, tables: [订单]}
  - {area: metric, description: 派生指标（毛利 = 订单金额 − 订单成本、毛利率）需要指标之间做减法, tables: [订单]}
