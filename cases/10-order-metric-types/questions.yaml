case: 10-order-metric-types
note: 标准答案由 sql 在 data/ 上算出（tools/casekit.py answers），并由 prepare/truth_from_raw.py 直接从 Malloy 样例的原始 parquet 独立重算核对。销售额、毛利沿用 Malloy 演示模型的口径：按全部订单明细的售价合计（含已取消、已退货），毛利 = 售价合计 − 对应库存件成本合计。q01–q08 的问题意图取自 Malloy 官方样例 ecommerce.malloy 的度量与看板视图，统计范围是本案例裁剪后的 Florida 用户。
questions:
- id: q01
  question: 全部订单明细（含所有状态）的总销售额、订单数和总毛利各是多少？
  sql: SELECT ROUND(SUM(o.售价), 2), COUNT(DISTINCT o.订单编号), ROUND(SUM(o.售价) - SUM(i.成本), 2) FROM 订单明细 o JOIN 库存件 i ON o.库存件编号 = i.库存件编号
  must_include:
  - - 447473.07
  - - 9201
  - - 232905.84
  source: Malloy 官方样例 ecommerce.malloy 的 view business_overview_dashboard（度量 total_sales、order_count、total_gross_margin）
  expected:
    columns:
    - ROUND(SUM(o.售价), 2)
    - COUNT(DISTINCT o.订单编号)
    - ROUND(SUM(o.售价) - SUM(i.成本), 2)
    rows:
    - - 447473.07
      - 9201
      - 232905.84
  qtype: 跨表关联
- id: q02
  question: 按商品品类统计销售额（含所有状态），排前 5 的品类是哪些？各多少？
  sql: SELECT i.商品品类, ROUND(SUM(o.售价), 2) AS s FROM 订单明细 o JOIN 库存件 i ON o.库存件编号 = i.库存件编号 GROUP BY i.商品品类 ORDER BY s DESC LIMIT 5
  must_include:
  - - Jeans
    - 牛仔裤
  - - 66745.31
  - - Accessories
    - 配饰
  - - 44310.84
  - - Fashion Hoodies
    - 卫衣
  - - 40287.99
  - - Outerwear
    - 外套
  - - 35251.31
  - - Tops & Tees
    - Tops
    - T恤
  - - 32315.4
  source: Malloy 官方样例 ecommerce.malloy 的 view top_categories
  expected:
    columns:
    - 商品品类
    - s
    rows:
    - - Jeans
      - 66745.31
    - - Accessories
      - 44310.84
    - - Fashion Hoodies & Sweatshirts
      - 40287.99
    - - Outerwear & Coats
      - 35251.31
    - - Tops & Tees
      - 32315.4
  qtype: 跨表关联
- id: q03
  question: 按品牌统计销售额（含所有状态），排前 3 的品牌是哪些？各自的销售额和占总销售额的比例是多少？
  sql: SELECT i.商品品牌, ROUND(SUM(o.售价), 2) AS s, ROUND(SUM(o.售价) / (SELECT SUM(售价) FROM 订单明细), 4) FROM 订单明细 o JOIN 库存件 i ON o.库存件编号 = i.库存件编号 GROUP BY i.商品品牌 ORDER BY s DESC LIMIT 3
  must_include:
  - - Levi's
    - Levi
    - 李维斯
  - - 60215.79
  - - 0.1346
  - - Ray-Ban
    - 雷朋
  - - 32758.0
  - - 0.0732
  - - Columbia
    - 哥伦比亚
  - - 28607.97
  - - 0.0639
  source: Malloy 官方样例 ecommerce.malloy 的 view top_brands（度量 total_sales、percent_of_sales）
  expected:
    columns:
    - 商品品牌
    - s
    - ROUND(SUM(o.售价) / (SELECT SUM(售价) FROM 订单明细), 4)
    rows:
    - - Levi's
      - 60215.79
      - 0.1346
    - - Ray-Ban
      - 32758.0
      - 0.0732
    - - Columbia
      - 28607.97
      - 0.0639
  qtype: 跨表关联
- id: q04
  question: 2022 年哪个月的销售额（含所有状态）最高？是多少？
  sql: SELECT substr(下单时间, 1, 7) AS m, ROUND(SUM(售价), 2) AS s FROM 订单明细 WHERE 下单时间 LIKE '2022-%' GROUP BY m ORDER BY s DESC LIMIT 1
  must_include:
  - - 2022-09
    - 9月
    - 2022年9月
  - - 17911.37
  source: Malloy 官方样例 ecommerce.malloy 的 view sales_by_month_2022
  expected:
    columns:
    - m
    - s
    rows:
    - - 2022-09
      - 17911.37
  qtype: 排名
- id: q05
  question: 按订单明细的状态统计订单数（同一状态下按订单编号去重），各状态各有多少个订单？
  sql: SELECT 状态, COUNT(DISTINCT 订单编号) FROM 订单明细 GROUP BY 状态 ORDER BY 状态
  must_include:
  - - 298
  - - 8721
  - - 45
  - - 79
  - - 61
  source: Malloy 官方样例 ecommerce.malloy 的 view orders_by_status
  expected:
    columns:
    - 状态
    - COUNT(DISTINCT 订单编号)
    rows:
    - - Cancelled
      - 298
    - - Complete
      - 8721
    - - Processing
      - 45
    - - Returned
      - 79
    - - Shipped
      - 61
  qtype: 分组统计
- id: q06
  question: 退货不止一件的用户有哪些（用户编号）？各退了几件、退货金额合计多少？
  sql: SELECT 用户编号, COUNT(*) AS c, ROUND(SUM(售价), 2) FROM 订单明细 WHERE 状态 = 'Returned' GROUP BY 用户编号 HAVING COUNT(*) > 1 ORDER BY 用户编号
  must_include:
  - - '21722'
  - - 52.99
  - - '147602'
  - - 74.3
  source: Malloy 官方样例 ecommerce.malloy 的 view frequent_returners
  expected:
    columns:
    - 用户编号
    - c
    - ROUND(SUM(售价), 2)
    rows:
    - - 21722
      - 2
      - 52.99
    - - 147602
      - 2
      - 74.3
  qtype: 分组统计
- id: q07
  question: 2022 年的销售额（含所有状态）是多少？比 2021 年增长了多少？同比增长率是多少？
  sql: SELECT ROUND(a.s, 2), ROUND(a.s - b.s, 2), ROUND(a.s / b.s - 1, 4) FROM (SELECT SUM(售价) AS s FROM 订单明细 WHERE 下单时间 LIKE '2022-%') a, (SELECT SUM(售价) AS s FROM 订单明细 WHERE 下单时间 LIKE '2021-%') b
  must_include:
  - - 162878.33
  - - 26125.56
  - - 0.191
  source: Malloy 官方样例 ecommerce.malloy 的 view sales_summary_yoy（total_sales_2022、sales_growth、sales_yoy）
  expected:
    columns:
    - ROUND(a.s, 2)
    - ROUND(a.s - b.s, 2)
    - ROUND(a.s / b.s - 1, 4)
    rows:
    - - 162878.33
      - 26125.56
      - 0.191
  qtype: 单表聚合
- id: q08
  question: 销售额（含所有状态）最高的商品是哪个？销售额多少？
  sql: SELECT i.商品名称, ROUND(SUM(o.售价), 2) AS s FROM 订单明细 o JOIN 库存件 i ON o.库存件编号 = i.库存件编号 GROUP BY i.商品名称 ORDER BY s DESC LIMIT 1
  must_include:
  - - RB2132
    - New Wayfarer
  - - 29668.45
  source: Malloy 官方样例 ecommerce.malloy 的 view top_products
  expected:
    columns:
    - 商品名称
    - s
    rows:
    - - Ray-Ban RB2132  New Wayfarer Sunglasses
      - 29668.45
  qtype: 跨表关联
- id: q09
  question: 已退货的订单明细占全部订单明细的比例是多少？
  sql: SELECT SUM(状态 = 'Returned'), COUNT(*), ROUND(1.0 * SUM(状态 = 'Returned') / COUNT(*), 4) FROM 订单明细
  must_include:
  - - 0.0084
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - SUM(状态 = 'Returned')
    - COUNT(*)
    - ROUND(1.0 * SUM(状态 = 'Returned') / COUNT(*), 4)
    rows:
    - - 79
      - 9448
      - 0.0084
  qtype: 比率
- id: q10
  question: 2022 年 1 月至 6 月的累计销售额（含所有状态）是多少？
  sql: SELECT ROUND(SUM(售价), 2) FROM 订单明细 WHERE 下单时间 >= '2022-01-01' AND 下单时间 < '2022-07-01'
  must_include:
  - - 87596.34
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - ROUND(SUM(售价), 2)
    rows:
    - - 87596.34
  qtype: 时间筛选
- id: q11
  question: 首次下单（用户最早一条订单明细的下单时间）在 2021 年的用户有多少个？其中在首单后 90 天内又下了另一笔订单的用户占多少比例？
  sql: WITH f AS (SELECT 用户编号, MIN(下单时间) AS t FROM 订单明细 GROUP BY 用户编号), c AS (SELECT f.用户编号, MAX(CASE WHEN o.下单时间 > f.t AND julianday(o.下单时间) <= julianday(f.t) + 90 AND o.订单编号 <> (SELECT 订单编号 FROM 订单明细 WHERE 用户编号 = f.用户编号 AND 下单时间 = f.t LIMIT 1) THEN 1 ELSE 0 END) AS rep FROM f JOIN 订单明细 o ON o.用户编号 = f.用户编号 WHERE f.t LIKE '2021-%' GROUP BY f.用户编号) SELECT COUNT(*), SUM(rep), ROUND(1.0 * SUM(rep) / COUNT(*), 4) FROM c
  must_include:
  - - 1369
  - - 0.2725
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - COUNT(*)
    - SUM(rep)
    - ROUND(1.0 * SUM(rep) / COUNT(*), 4)
    rows:
    - - 1369
      - 373
      - 0.2725
  qtype: 跨表关联
- id: q12
  question: 2022 年的毛利（售价合计减去对应库存件成本合计，含所有状态）是多少？
  sql: SELECT ROUND(SUM(o.售价) - SUM(i.成本), 2) FROM 订单明细 o JOIN 库存件 i ON o.库存件编号 = i.库存件编号 WHERE o.下单时间 LIKE '2022-%'
  must_include:
  - - 85216.26
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - ROUND(SUM(o.售价) - SUM(i.成本), 2)
    rows:
    - - 85216.26
  qtype: 跨表关联
