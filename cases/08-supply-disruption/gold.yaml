gold_version: case08-supply-disruption-v1
status: frozen
protocol: entity-model-score-v1
weights: {entities: 0.3, identifiers: 0.2, relations: 0.3, metrics: 0.2}
weights_rationale: 沿用协议默认权重。
derivation: >-
  本案例为自建合成数据，表结构、主键与外键由 prepare/build_data.py 的生成规则决定，金标按生成规则写出并用 tools/casekit.py gold 核验。
  订单金额 = 订单明细金额之和（生成时保证一致）。指标取剧本里要回答的量：订单金额、订单数、待发货订单数、在库数量、订货数量、计划数量。
entities:
  - {table: 配送中心, kind: object, label: 配送中心, identifier: [[配送中心代码], [配送中心名称]]}
  - {table: 成品, kind: object, label: 成品, identifier: [[成品编码], [成品名称]]}
  - {table: 工厂, kind: object, label: 工厂, identifier: [[工厂代码], [工厂名称]]}
  - {table: 客户, kind: object, label: 客户, identifier: [[客户编码]]}
  - {table: 配送中心库存, kind: object, label: 配送中心库存, identifier: [[配送中心代码, 成品编码]]}
  - {table: 销售订单, kind: event, label: 销售订单, identifier: [[订单号]]}
  - {table: 订单明细, kind: event, label: 订单明细, identifier: [[订单号, 行号]]}
  - {table: 生产计划, kind: event, label: 生产计划, identifier: [[计划号]]}
relations:
  - {from: 配送中心库存, to: 配送中心, on: [[配送中心代码, 配送中心代码]], relationship: many_to_one}
  - {from: 配送中心库存, to: 成品, on: [[成品编码, 成品编码]], relationship: many_to_one}
  - {from: 销售订单, to: 客户, on: [[客户编码, 客户编码]], relationship: many_to_one}
  - {from: 销售订单, to: 配送中心, on: [[发货配送中心代码, 配送中心代码]], relationship: many_to_one}
  - {from: 订单明细, to: 销售订单, on: [[订单号, 订单号]], relationship: many_to_one}
  - {from: 订单明细, to: 成品, on: [[成品编码, 成品编码]], relationship: many_to_one}
  - {from: 生产计划, to: 工厂, on: [[工厂代码, 工厂代码]], relationship: many_to_one}
  - {from: 生产计划, to: 成品, on: [[成品编码, 成品编码]], relationship: many_to_one}
metrics:
  - {table: 销售订单, label: 订单金额, aggregate: sum, column: 订单金额, filters: []}
  - {table: 销售订单, label: 订单数, aggregate: count, column: null, filters: []}
  - {table: 销售订单, label: 待发货订单数, aggregate: count, column: null, filters: [{column: 订单状态, op: eq, value: 待发货}]}
  - {table: 配送中心库存, label: 在库数量, aggregate: sum, column: 在库数量, filters: []}
  - {table: 订单明细, label: 订货数量, aggregate: sum, column: 数量, filters: []}
  - {table: 生产计划, label: 计划数量, aggregate: sum, column: 计划数量, filters: []}
  - {table: 销售订单, label: 待发货订单金额, aggregate: sum, column: 订单金额, filters: [{column: 订单状态, op: eq, value: 待发货}], required: false}
  - {table: 订单明细, label: 明细金额, aggregate: sum, column: 金额, filters: [], required: false}
  - {table: 配送中心库存, label: 安全库存, aggregate: sum, column: 安全库存, filters: [], required: false}
  - {table: 客户, label: 客户数, aggregate: count, column: null, filters: [], required: false}
  - {table: 客户, label: A 级客户数, aggregate: count, column: null, filters: [{column: 客户等级, op: eq, value: A}], required: false}
  - {table: 销售订单, label: 已签收订单数, aggregate: count, column: null, filters: [{column: 订单状态, op: eq, value: 已签收}], required: false}
  - {table: 销售订单, label: 已发货订单数, aggregate: count, column: null, filters: [{column: 订单状态, op: eq, value: 已发货}], required: false}
format_gaps:
  - {area: metric, description: 可调拨量（在库数量 − 安全库存）需要列与列运算, tables: [配送中心库存]}
  - {area: metric, description: 受停运影响的订单需要关联配送中心的状态（跨表筛选）, tables: [销售订单, 配送中心]}
