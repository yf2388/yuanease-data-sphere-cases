case: 08-supply-disruption
note: 标准答案由 sql 在 data/ 上算出（tools/casekit.py answers），并由 prepare/truth_from_raw.py 直接从 Brunel 原始 xlsx 独立重算核对。停运是假设情景：原始数据本身没有停运记录，题目问的是「如果某仓库停运，哪些订单、客户、产品受影响，哪些仓库能替代」。
questions:
- id: q01
  question: 订单数据是哪一天的？一共多少张订单、来自多少家客户、涉及多少种产品？
  sql: SELECT MIN(订单日期), MAX(订单日期), COUNT(*), COUNT(DISTINCT 客户), COUNT(DISTINCT 产品编号) FROM 订单
  must_include:
  - - '2013-05-26'
    - 2013年5月26日
    - 5月26日
  - - 9215
  - - 46
  - - 772
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - MIN(订单日期)
    - MAX(订单日期)
    - COUNT(*)
    - COUNT(DISTINCT 客户)
    - COUNT(DISTINCT 产品编号)
    rows:
    - - '2013-05-26'
      - '2013-05-26'
      - 9215
      - 46
      - 772
  qtype: 单表聚合
- id: q02
  question: 有发出订单的仓库一共几个？发单最多的是哪个仓库、多少张？
  sql: SELECT (SELECT COUNT(DISTINCT 仓库代码) FROM 订单), 仓库代码, COUNT(*) AS c FROM 订单 GROUP BY 仓库代码 ORDER BY c DESC LIMIT 1
  must_include:
  - - 7
  - - PLANT03
  - - 8541
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - (SELECT COUNT(DISTINCT 仓库代码) FROM 订单)
    - 仓库代码
    - c
    rows:
    - - 7
      - PLANT03
      - 8541
  qtype: 排名
- id: q03
  question: 仓库 PLANT12 发出的订单有多少张？数量合计多少件？涉及几家客户？
  sql: SELECT COUNT(*), SUM(数量), COUNT(DISTINCT 客户) FROM 订单 WHERE 仓库代码 = 'PLANT12'
  must_include:
  - - 300
  - - 112000
  - - 13
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - COUNT(*)
    - SUM(数量)
    - COUNT(DISTINCT 客户)
    rows:
    - - 300
      - 112000
      - 13
  qtype: 单表聚合
- id: q04
  question: 仓库 PLANT08 的订单涉及几种产品？其中有没有除 PLANT08 之外没有任何其他仓库能供应的产品？是哪种？
  sql: SELECT (SELECT COUNT(DISTINCT 产品编号) FROM 订单 WHERE 仓库代码 = 'PLANT08'), o.产品编号 FROM 订单 o WHERE o.仓库代码 = 'PLANT08' AND NOT EXISTS (SELECT 1 FROM 仓库可供产品 p WHERE p.产品编号 = o.产品编号 AND p.仓库代码 <> 'PLANT08') GROUP BY o.产品编号
  must_include:
  - - 14
  - - '1681882'
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - (SELECT COUNT(DISTINCT 产品编号) FROM 订单 WHERE 仓库代码 = 'PLANT08')
    - 产品编号
    rows:
    - - 14
      - 1681882
  qtype: 多表综合
- id: q05
  question: 仓库 PLANT08 的订单中，有多少张延迟发货（延迟发货天数大于 0）？
  sql: SELECT COUNT(*) FROM 订单 WHERE 仓库代码 = 'PLANT08' AND 延迟发货天数 > 0
  must_include:
  - - 18
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - COUNT(*)
    rows:
    - - 18
  qtype: 单表聚合
- id: q06
  question: 全部订单按服务方式统计，DTD、DTP、CRF 各有多少张？
  sql: SELECT 服务方式, COUNT(*) FROM 订单 GROUP BY 服务方式 ORDER BY 服务方式
  must_include:
  - - 854
  - - 2143
  - - 6218
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - 服务方式
    - COUNT(*)
    rows:
    - - CRF
      - 854
    - - DTD
      - 2143
    - - DTP
      - 6218
  qtype: 分组统计
- id: q07
  question: 日处理订单能力最大的仓库是哪个、能力是多少？单位仓储成本最高的仓库是哪个、成本是多少？
  sql: SELECT a.仓库代码, a.日处理订单能力, b.仓库代码, ROUND(b.单位仓储成本, 4) FROM (SELECT * FROM 仓库产能 ORDER BY 日处理订单能力 DESC LIMIT 1) a, (SELECT * FROM 仓库成本 ORDER BY 单位仓储成本 DESC LIMIT 1) b
  must_include:
  - - PLANT01
  - - 1070
  - - PLANT18
  - - 2.0363
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - 仓库代码
    - 日处理订单能力
    - 仓库代码
    - ROUND(b.单位仓储成本, 4)
    rows:
    - - PLANT01
      - 1070
      - PLANT18
      - 2.0363
  qtype: 排名
- id: q08
  question: 哪些仓库有 VMI 专属客户？各有几家？
  sql: SELECT 仓库代码, COUNT(*) FROM VMI客户 GROUP BY 仓库代码 ORDER BY 仓库代码
  must_include:
  - - PLANT02
  - - 7
  - - PLANT06
  - - PLANT10
  - - 4
  - - PLANT11
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - 仓库代码
    - COUNT(*)
    rows:
    - - PLANT02
      - 7
    - - PLANT06
      - 2
    - - PLANT10
      - 4
    - - PLANT11
      - 1
  qtype: 分组统计
- id: q09
  question: 承运商 V444_0 承运了多少张订单？这些订单的重量合计是多少？
  sql: SELECT COUNT(*), ROUND(SUM(重量), 2) FROM 订单 WHERE 承运商 = 'V444_0'
  must_include:
  - - 6264
  - - 121440.44
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - COUNT(*)
    - ROUND(SUM(重量), 2)
    rows:
    - - 6264
      - 121440.44
  qtype: 单表聚合
- id: q10
  question: 从 PORT04 起运的订单占全部订单的比例是多少？
  sql: SELECT SUM(起运港 = 'PORT04'), COUNT(*), ROUND(1.0 * SUM(起运港 = 'PORT04') / COUNT(*), 4) FROM 订单
  must_include:
  - - 0.9811
  source: 案例作者按本案例数据出题
  expected:
    columns:
    - SUM(起运港 = 'PORT04')
    - COUNT(*)
    - ROUND(1.0 * SUM(起运港 = 'PORT04') / COUNT(*), 4)
    rows:
    - - 9041
      - 9215
      - 0.9811
  qtype: 比率
- id: q11
  question: 假设仓库 PLANT08 停运，受影响订单里订购数量合计最大的是哪种产品、多少件？除 PLANT08 外还有哪些仓库能供应这种产品，它们的日处理订单能力各是多少？
  sql: WITH top AS (SELECT 产品编号, SUM(数量) AS q FROM 订单 WHERE 仓库代码 = 'PLANT08' GROUP BY 产品编号 ORDER BY q DESC LIMIT 1) SELECT top.产品编号, top.q, p.仓库代码, c.日处理订单能力 FROM top JOIN 仓库可供产品 p ON p.产品编号 = top.产品编号 AND p.仓库代码 <> 'PLANT08' JOIN 仓库产能 c ON c.仓库代码 = p.仓库代码 ORDER BY p.仓库代码
  must_include:
  - - '1691700'
  - - 172034
  - - PLANT03
  - - 1013
  - - PLANT07
  - - 265
  - - PLANT10
  - - 118
  source: Palantir 博客「Building with Palantir AIP：Logic Tools for RAG/OAG」配送中心起火剧本中「找出缺口最大的产品、看哪些正常运营的配送中心能补上」一步的问题意图，改写为本案例的仓库停运假设
  expected:
    columns:
    - 产品编号
    - q
    - 仓库代码
    - 日处理订单能力
    rows:
    - - 1691700
      - 172034
      - PLANT03
      - 1013
    - - 1691700
      - 172034
      - PLANT07
      - 265
    - - 1691700
      - 172034
      - PLANT10
      - 118
  qtype: 多表综合
