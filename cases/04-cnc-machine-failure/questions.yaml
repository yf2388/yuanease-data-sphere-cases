case: 04-cnc-machine-failure
note: 期望值由 sql 在 data/ 上独立算出（python3 -I tools/casekit.py answers <案例目录> --write）。判对规则同 01 案例。
questions:
- id: q01
  question: 9 月一共加工了多少次？其中多少次发生了设备故障？故障率是多少？
  sql: SELECT COUNT(*), SUM(是否故障 = '是'), ROUND(1.0 * SUM(是否故障 = '是') / COUNT(*), 4) FROM 加工记录
  must_include:
  - 10000
  - 339
  - - 0.0339
    - 3.39
  expected:
    columns:
    - COUNT(*)
    - SUM(是否故障 = '是')
    - ROUND(1.0 * SUM(是否故障 = '是') / COUNT(*), 4)
    rows:
    - - 10000
      - 339
      - 0.0339
  qtype: 比率
  source: 案例作者按本案例数据出题
- id: q02
  question: 各失效模式各发生了多少次故障事件？哪种最多？
  sql: SELECT m.失效模式名称, COUNT(*) FROM 故障事件 e JOIN 失效模式 m ON e.失效模式代码 = m.失效模式代码 GROUP BY m.失效模式名称 ORDER BY 2 DESC
  expected:
    columns:
    - 失效模式名称
    - COUNT(*)
    rows:
    - - 散热失效
      - 115
    - - 过应变失效
      - 98
    - - 功率失效
      - 95
    - - 刀具磨损失效
      - 46
    - - 随机失效
      - 19
  qtype: 跨表关联
  source: 案例作者按本案例数据出题
- id: q03
  question: 哪台设备的故障次数最多？故障了几次？
  sql: SELECT 设备编号, SUM(是否故障 = '是') AS n FROM 加工记录 GROUP BY 设备编号 ORDER BY n DESC LIMIT 1
  expected:
    columns:
    - 设备编号
    - n
    rows:
    - - CNC-05
      - 134
  qtype: 排名
  source: 案例作者按本案例数据出题
- id: q04
  question: 低、中、高三个质量等级的产品，各自的故障率是多少？
  sql: SELECT 质量等级, ROUND(1.0 * SUM(是否故障 = '是') / COUNT(*), 4) FROM 加工记录 GROUP BY 质量等级 ORDER BY 质量等级
  must_include:
  - 低
  - 中
  - 高
  - - 0.0392
    - 3.92
  - - 0.0277
    - 2.77
  - - 0.0209
    - 2.09
  expected:
    columns:
    - 质量等级
    - ROUND(1.0 * SUM(是否故障 = '是') / COUNT(*), 4)
    rows:
    - - 中
      - 0.0277
    - - 低
      - 0.0392
    - - 高
      - 0.0209
  qtype: 比率
  source: 案例作者按本案例数据出题
- id: q05
  question: 三个班组各发生了多少次设备故障？
  sql: SELECT b.班组名称, SUM(r.是否故障 = '是') FROM 加工记录 r JOIN 班组 b ON r.班组编号 = b.班组编号 GROUP BY b.班组名称 ORDER BY 1
  expected:
    columns:
    - 班组名称
    - SUM(r.是否故障 = '是')
    rows:
    - - 丙组
      - 126
    - - 乙组
      - 111
    - - 甲组
      - 102
  qtype: 跨表关联
  source: 案例作者按本案例数据出题
- id: q06
  question: 哪条产线的设备故障次数最多？是多少次？
  sql: SELECT l.产线名称, SUM(r.是否故障 = '是') AS n FROM 加工记录 r JOIN 设备台账 d ON r.设备编号 = d.设备编号 JOIN 产线 l ON d.产线编号 = l.产线编号 GROUP BY l.产线名称 ORDER BY n DESC LIMIT 1
  expected:
    columns:
    - 产线名称
    - n
    rows:
    - - 法兰加工线
      - 177
  qtype: 多表综合
  source: 案例作者按本案例数据出题
- id: q07
  question: 发生故障的加工记录和没有故障的加工记录，平均刀具磨损分别是多少分钟？
  sql: SELECT ROUND(AVG(CASE WHEN 是否故障 = '是' THEN 刀具磨损_分钟 END), 2), ROUND(AVG(CASE WHEN 是否故障 = '否' THEN 刀具磨损_分钟 END), 2) FROM 加工记录
  must_include:
  - - 143.78
    - 143.8
  - - 106.69
    - 106.7
  expected:
    columns:
    - ROUND(AVG(CASE WHEN 是否故障 = '是' THEN 刀具磨损_分钟 END), 2)
    - ROUND(AVG(CASE WHEN 是否故障 = '否' THEN 刀具磨损_分钟 END), 2)
    rows:
    - - 143.78
      - 106.69
  qtype: 单表聚合
  source: 案例作者按本案例数据出题
- id: q08
  question: 9 月 8 日到 9 月 14 日这一周，一共发生了多少次设备故障？
  sql: SELECT COUNT(*) FROM 加工记录 WHERE 加工时间 >= '2026-09-08' AND 加工时间 < '2026-09-15' AND 是否故障 = '是'
  expected:
    columns:
    - COUNT(*)
    rows:
    - - 89
  qtype: 时间筛选
  source: 案例作者按本案例数据出题
- id: q09
  question: CNC-05 发生了多少次散热失效（HDF）？
  sql: SELECT COUNT(*) FROM 故障事件 WHERE 设备编号 = 'CNC-05' AND 失效模式代码 = 'HDF'
  expected:
    columns:
    - COUNT(*)
    rows:
    - - 108
  qtype: 单表聚合
  source: 案例作者按本案例数据出题
- id: q10
  question: 有多少条加工记录标记了设备故障，却没有对应任何故障事件？
  sql: SELECT COUNT(*) FROM 加工记录 r WHERE r.是否故障 = '是' AND NOT EXISTS (SELECT 1 FROM 故障事件 e WHERE e.记录编号 = r.记录编号)
  expected:
    columns:
    - COUNT(*)
    rows:
    - - 9
  qtype: 多表综合
  source: 案例作者按本案例数据出题
- id: q11
  question: 加工记录里，发生设备故障和没有发生故障的各有多少条？故障率是多少？
  sql: SELECT SUM(是否故障 = '是') AS 故障, SUM(是否故障 = '否') AS 未故障, ROUND(1.0 * SUM(是否故障 = '是') / COUNT(*), 4) AS 故障率 FROM 加工记录
  expected:
    columns:
    - 故障
    - 未故障
    - 故障率
    rows:
    - - 339
      - 9661
      - 0.0339
  qtype: 比率
  source: Microsoft Fabric 数据科学教程「predictive maintenance」 Step 3「Inspect the target variable for class imbalance」
- id: q12
  question: 各失效模式各触发了多少次故障事件？哪种最多？
  sql: SELECT m.失效模式名称, COUNT(*) AS 次数 FROM 故障事件 f JOIN 失效模式 m ON m.失效模式代码 = f.失效模式代码 GROUP BY m.失效模式名称 ORDER BY 次数 DESC
  expected:
    columns:
    - 失效模式名称
    - 次数
    rows:
    - - 散热失效
      - 115
    - - 过应变失效
      - 98
    - - 功率失效
      - 95
    - - 刀具磨损失效
      - 46
    - - 随机失效
      - 19
  qtype: 跨表关联
  source: Microsoft Fabric 数据科学教程「predictive maintenance」 Step 3 按故障类型计数；UCI AI4I 2020 数据集页失效模式说明（UCI 文字里 TWF、RNF 的次数与数据标志位不符，以数据为准）
- id: q13
  question: 发生故障和没有故障的加工记录，平均刀具磨损（分钟）和平均扭矩（Nm）分别是多少？
  sql: SELECT 是否故障, ROUND(AVG(刀具磨损_分钟), 2) AS 平均刀具磨损_分钟, ROUND(AVG(扭矩_Nm), 2) AS 平均扭矩_Nm FROM 加工记录 GROUP BY 是否故障
  expected:
    columns:
    - 是否故障
    - 平均刀具磨损_分钟
    - 平均扭矩_Nm
    rows:
    - - 否
      - 106.69
      - 39.63
    - - 是
      - 143.78
      - 50.17
  must_include:
  - 143.78
  - 50.17
  - 106.69
  - 39.63
  qtype: 分组统计
  source: Microsoft Fabric 数据科学教程「predictive maintenance」 Step 6 Power BI 结论：刀具磨损与扭矩在故障与非故障之间形成分界（改为两组均值对比）
- id: q14
  question: 低、中、高三个质量等级的加工记录各有多少条、各占多少比例？
  sql: SELECT 质量等级, COUNT(*) AS 记录数, ROUND(1.0 * COUNT(*) / (SELECT COUNT(*) FROM 加工记录), 4) AS 占比 FROM 加工记录 GROUP BY 质量等级 ORDER BY 记录数 DESC
  expected:
    columns:
    - 质量等级
    - 记录数
    - 占比
    rows:
    - - 低
      - 6000
      - 0.6
    - - 中
      - 2997
      - 0.2997
    - - 高
      - 1003
      - 0.1003
  qtype: 比率
  source: Microsoft Fabric 数据科学教程「predictive maintenance」 Step 2 数据说明（低 60%、中 30%、高 10%）
